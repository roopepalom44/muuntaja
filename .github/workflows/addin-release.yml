name: Test, build and release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy
      - run: python -m pytest tests --tb=short

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install QGIS Python bindings
        run: |
          # The Azure mirror can throttle large QGIS dependencies for minutes.
          for source_file in /etc/apt/sources.list /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source_file" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source_file"
            fi
          done
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install -y --no-install-recommends \
            python3-qgis qgis-providers python3-gdal python3-pytest python3-numpy

      - name: Set up .NET 8 for the DWG writer
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build the ACadSharp DWG writer
        run: /usr/bin/python3 qgis_plugin/build_dwgwriter.py --rid linux-x64

      - name: Lint
        run: |
          pipx run ruff check --select F,E9 --extension pyt:python \
            Toolboxes qgis_plugin tests

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          /usr/bin/python3 -m pytest tests --tb=short
          /usr/bin/python3 SharedHelp/test_qgis_help.py

  dwg-writer-macos:
    # macOS binaries must be (ad-hoc) code signed to run on Apple Silicon,
    # which the .NET SDK only does when publishing on macOS.
    if: github.event_name == 'push'
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build and smoke-test the macOS DWG writers
        run: |
          python3 qgis_plugin/build_dwgwriter.py --rid osx-arm64 --rid osx-x64
          qgis_plugin/muuntaja_qgis/acadsharp/osx-arm64/muuntaja-dwg tests/data/cad_sample.dxf "$RUNNER_TEMP/smoke.dwg"
      - uses: actions/upload-artifact@v4
        with:
          name: dwg-writer-macos
          path: qgis_plugin/muuntaja_qgis/acadsharp/osx-*/muuntaja-dwg
          if-no-files-found: error

  build-and-release:
    needs: [test, unit, dwg-writer-macos]
    if: github.event_name == 'push'
    runs-on: windows-2025
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Validate Pro 3.5 API baseline and prepare unique AddInX version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $sdks = & dotnet --list-sdks
          if ($LASTEXITCODE -ne 0 -or -not ($sdks | Where-Object { $_ -match '^8\.' })) {
            throw 'The release runner must have the .NET 8 SDK installed.'
          }

          $configPath = Join-Path $env:GITHUB_WORKSPACE 'Config.daml'
          $daml = [IO.File]::ReadAllText($configPath)
          [xml]$config = $daml
          $namespaces = [Xml.XmlNamespaceManager]::new($config.NameTable)
          $namespaces.AddNamespace('daml', 'http://schemas.esri.com/DADF/Registry')
          $addInInfo = $config.SelectSingleNode('/daml:ArcGIS/daml:AddInInfo', $namespaces)
          if ($null -eq $addInInfo) {
            throw 'Could not find ArcGIS AddInInfo in Config.daml.'
          }

          $desktopVersion = $addInInfo.GetAttribute('desktopVersion')
          if ($desktopVersion -notmatch '^3\.5(?:\.|$)') {
            throw "Config.daml must keep ArcGIS Pro 3.5 as its minimum version; found $desktopVersion."
          }

          $projectPath = Join-Path $env:GITHUB_WORKSPACE 'Muuntaja.csproj'
          [xml]$project = [IO.File]::ReadAllText($projectPath)
          $apiPackage = $project.SelectSingleNode('/Project/ItemGroup/PackageReference[@Include="Esri.ArcGISPro.Extensions30"]')
          if ($null -eq $apiPackage -or $apiPackage.GetAttribute('Version') -ne '3.5.0.57366') {
            throw 'The add-in must compile against Esri.ArcGISPro.Extensions30 3.5.0.57366.'
          }

          $versionPattern = [regex]'(?s)(<AddInInfo\b[^>]*\bversion=")(?<version>[^"]+)(")'
          $versionMatches = $versionPattern.Matches($daml)
          if ($versionMatches.Count -ne 1) {
            throw 'Expected exactly one AddInInfo version in Config.daml.'
          }
          $match = $versionMatches[0]
          $baseVersion = $match.Groups['version'].Value
          if ($baseVersion -notmatch '^\d+(?:\.\d+){0,2}$') {
            throw "Config.daml version must have one to three numeric parts before CI adds its run number; found $baseVersion."
          }

          $releaseVersion = "$baseVersion.$env:GITHUB_RUN_NUMBER"
          $versionStart = $match.Groups['version'].Index
          $daml = $daml.Remove($versionStart, $match.Groups['version'].Length)
          $daml = $daml.Insert($versionStart, $releaseVersion)
          [IO.File]::WriteAllText($configPath, $daml, [Text.UTF8Encoding]::new($false))

          $tag = "v$releaseVersion"
          $outputs = "version=$releaseVersion`ntag=$tag`n"
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, $outputs, [Text.UTF8Encoding]::new($false))
          Write-Host "Building Pro 3.5-compatible AddInX $releaseVersion ($tag)."

      - name: Synchronize canonical offline manual
        run: python SharedHelp/sync.py --fetch

      - name: Build AddInX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\build-addin.ps1 -Configuration Release -TargetFramework net8.0-windows
          if ($LASTEXITCODE -ne 0) {
            throw "AddInX build failed with exit code $LASTEXITCODE."
          }

          $package = Join-Path $env:GITHUB_WORKSPACE 'bin\Release\net8.0-windows\Muuntaja.esriAddInX'
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) {
            throw "The expected AddInX package was not created: $package"
          }
          Get-Item -LiteralPath $package | Select-Object FullName, Length
          $asset = Join-Path $env:RUNNER_TEMP 'Muuntaja.esriAddInX'
          Copy-Item -LiteralPath $package -Destination $asset -Force

      - name: Set up Python for QGIS plugin packaging
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download the macOS DWG writers
        uses: actions/download-artifact@v4
        with:
          name: dwg-writer-macos
          path: qgis_plugin/muuntaja_qgis/acadsharp

      - name: Build the Windows and Linux DWG writers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python qgis_plugin/build_dwgwriter.py --rid win-x64 --rid linux-x64 --rid linux-arm64
          if ($LASTEXITCODE -ne 0) { throw 'DWG writer build failed.' }
          & qgis_plugin/muuntaja_qgis/acadsharp/win-x64/muuntaja-dwg.exe tests/data/cad_sample.dxf (Join-Path $env:RUNNER_TEMP 'smoke.dwg')
          if ($LASTEXITCODE -ne 0) { throw 'DWG writer smoke test failed.' }

      - name: Package QGIS plugin
        shell: pwsh
        env:
          MUUNTAJA_REQUIRE_DWG_WRITER: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          python qgis_plugin/package.py
          if ($LASTEXITCODE -ne 0) { throw 'QGIS plugin packaging failed.' }
          $version = ((Get-Content qgis_plugin/muuntaja_qgis/metadata.txt | Where-Object { $_ -match '^version=' }) -replace '^version=', '').Trim()
          # Versioidut nimet kertovat sisällön, vakionimet antavat pysyvän
          # releases/latest/download-linkin README:hen.
          $copies = @{
            "Muuntaja-QGIS-$version.zip" = @("Muuntaja-QGIS-$version.zip", 'Muuntaja-QGIS.zip')
            "Muuntaja-QGIS-$version-Windows.zip" = @("Muuntaja-QGIS-$version-Windows.zip", 'Muuntaja-QGIS-Windows.zip')
          }
          foreach ($source in $copies.Keys) {
            $path = Join-Path $env:GITHUB_WORKSPACE "qgis_plugin/dist/$source"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing QGIS package: $path" }
            foreach ($name in $copies[$source]) {
              Copy-Item -LiteralPath $path -Destination (Join-Path $env:RUNNER_TEMP $name) -Force
            }
          }
          "qgis_version=$version" >> $env:GITHUB_ENV

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = Join-Path $env:RUNNER_TEMP 'Muuntaja.esriAddInX'
          $qgisZip = Join-Path $env:RUNNER_TEMP "Muuntaja-QGIS-$($env:qgis_version).zip"
          $windowsZip = Join-Path $env:RUNNER_TEMP "Muuntaja-QGIS-$($env:qgis_version)-Windows.zip"
          $qgisLatest = Join-Path $env:RUNNER_TEMP 'Muuntaja-QGIS.zip'
          $windowsLatest = Join-Path $env:RUNNER_TEMP 'Muuntaja-QGIS-Windows.zip'
          $ghArgs = @(
            'release', 'create', $env:RELEASE_TAG, $asset, $qgisZip, $windowsZip, $qgisLatest, $windowsLatest,
            '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA,
            '--title', "Muuntaja $env:RELEASE_VERSION",
            '--generate-notes'
          )
          & gh @ghArgs
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed with exit code $LASTEXITCODE."
          }
