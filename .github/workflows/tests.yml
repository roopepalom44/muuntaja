name: GIS regression tests

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy
      - run: python -m pytest tests --tb=short

  qgis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y python3-qgis python3-numpy
      - name: Run native QGIS tests
        env:
          QT_QPA_PLATFORM: offscreen
          QGIS_PREFIX_PATH: /usr
        run: /usr/bin/python3 -m unittest discover -s tests -p test_qgis_integration.py -v
